name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate notebook JSON
        run: python -m json.tool notebooks/research_quickstart.ipynb > /dev/null
      - name: Run reproducible example
        run: python examples/quickstart.py
      - name: Run tests
        run: pytest -q
